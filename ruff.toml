# ruff 配置（只用于开发期自查，不影响运行）
line-length = 120
target-version = "py39"

exclude = [
    ".venv",
    ".dev",
    ".npm-cache",
    ".pip-cache",
    ".tmp",
    "tools",
    "cache",
    "netease-api",
    "__pycache__",
]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # 中文注释/字符串按字符数算长度，E501 意义不大，只在极端情况下提示
    "E501",
]
